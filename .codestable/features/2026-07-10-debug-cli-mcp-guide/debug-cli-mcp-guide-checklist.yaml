feature: 2026-07-10-debug-cli-mcp-guide
created: '2026-07-10'
steps:
- id: S1
  action: 实现 CLI parser、exit codes 与 lifecycle skeleton
  exit_signal: help/unknown/missing/wrong args/signal/unexpected 的 exit/stdout/context cleanup 全部可判定
  verification: npm test -- --group debug-cli-shell --group debug-cli-lifecycle
  artifacts: [repo-nav bin, dispatcher, lifecycle/exit report]
  status: pending
- id: S2
  action: 实现 debug locate application adapter
  exit_signal: success/recoverable/tool-error 原样复用 LocateResult，exit 0/3 正确且无业务 internal imports
  verification: npm test -- --group debug-cli-locate
  artifacts: [LocateDebugCommand, import graph report, CLI transcripts]
  status: pending
- id: S3
  action: 实现 bounded debug probe 与 debug golden adapters
  exit_signal: probe 仅输出 BackendHealth diagnostics，golden 复用 shared evaluator，usage/failure/cleanup 可判定
  verification: npm test -- --group debug-cli-probe --group debug-cli-golden
  artifacts: [ProbeDebugCommand, GoldenDebugCommand, diagnostic transcripts]
  status: pending
- id: S4
  action: 编写四份 docs 并实现 executable docs/schema drift gate
  exit_signal: MCP/CLI snippets 真运行，reference 与 schema v1 一致，禁止字段和 minimal-loop 边界检查通过
  verification: npm run test:docs
  artifacts: [four docs, DocsSmokeRunner, schema drift report]
  status: pending
- id: S5
  action: 运行 MVP full regression 并生成 acceptance inventory
  exit_signal: build/typecheck/unit/Golden/MCP/docs 全绿且 artifacts/commands 完整
  verification: npm run build && npm run typecheck && npm test && npm run test:golden -- --all && npm run test:mcp -- --all && npm run test:docs
  artifacts: [full command logs, acceptance artifact inventory]
  status: pending
