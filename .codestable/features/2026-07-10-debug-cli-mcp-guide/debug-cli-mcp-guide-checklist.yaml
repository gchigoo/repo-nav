dod:
  commands:
  - id: CMD-BUILD
    command: npm run build
    core: true
    failure_handling: fix-or-block
  - id: CMD-TYPECHECK
    command: npm run typecheck
    core: true
    failure_handling: fix-or-block
  - id: CMD-SHELL
    command: npm test -- --group debug-cli-shell --group debug-cli-lifecycle
    core: true
    failure_handling: fix-or-block
  - id: CMD-LOCATE
    command: npm test -- --group debug-cli-locate
    core: true
    failure_handling: fix-or-block
  - id: CMD-DIAG
    command: npm test -- --group debug-cli-probe --group debug-cli-golden
    core: true
    failure_handling: fix-or-block
  - id: CMD-DOCS
    command: npm run test:docs
    core: true
    failure_handling: fix-or-block
  - id: CMD-ALL
    command: npm run build && npm run typecheck && npm test && npm run test:golden -- --all && npm run test:mcp -- --all && npm run test:docs
    core: true
    failure_handling: fix-or-block
  evidence_required: [command_output, diff_summary, artifact_inventory, import_graph_report, docs_drift_report]
  cleanliness:
    debug_output: formal-cli-output-only
    temporary_todo_fixme: forbidden
    commented_out_code: forbidden
    unused_imports: forbidden
