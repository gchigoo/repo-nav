feature: 2026-07-10-repository-evidence-foundation
created: '2026-07-10'
steps:
- id: S1
  action: 建立工程与五类 runner 基线
  exit_signal: build/typecheck/unit/golden/MCP 五个入口均启动真实程序并正确传播退出码
  verification: npm run build && npm run typecheck && npm test -- --group runner-smoke && npm run test:golden -- --case runner-smoke && npm run test:mcp -- --case runner-smoke
  artifacts: [package.json, lockfile, runner command logs]
  status: pending
- id: S2
  action: 固化公共 schema 与 normalization/ID/排序常量
  exit_signal: literal、byte、case、enum、ID、排序的正反 contract tests 全部通过
  verification: npm test -- --group contract --case term-case-parity
  artifacts: [src/contracts public exports, contract test report]
  status: pending
- id: S3
  action: 建立 fail-closed DI skeleton 与 test overrides
  exit_signal: context 可创建关闭，默认 provider fail closed，fake seams 可被 override
  verification: npm test -- --group di
  artifacts: [AppModule, runtime tokens, provider graph report]
  status: pending
- id: S4
  action: 建立 Golden success/error 判别联合与共享 evaluator
  exit_signal: success/error manifest 可判别且 required/forbidden/exclusion 断言有效
  verification: npm run test:golden -- --case manifest-schema --case evaluator-smoke
  artifacts: [GoldenCase schema, synthetic manifests, evaluator logs]
  status: pending
- id: S5
  action: 建立独立 McpLifecycleCase 与 MCP runner harness
  exit_signal: lifecycle schema 与 synthetic stdio frames/exit/timeout harness 通过且未混入 LocateResult
  verification: npm run test:mcp -- --case lifecycle-manifest-schema --case runner-smoke
  artifacts: [McpLifecycleCase schema, MCP harness logs]
  status: pending
