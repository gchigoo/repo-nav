  status: pending
- id: C3
  item: 四个 Symbol.for tokens 与唯一有序 backend collection seam
  source: design 1/2.1
  status: pending
- id: C4
  item: reader/service 默认 provider fail closed，不能返回伪 EvidencePack
  source: design 1/2.1/3.1
  status: pending
- id: C5
  item: test factory 通过 overrideProvider 替换 backend/reader/service
  source: design 2.1/2.2
  status: pending
- id: C6
  item: GoldenSuccessCase 与 GoldenErrorCase 组成判别联合并共用 evaluator
  source: design 0/2.1/3.1
  status: pending
- id: C7
