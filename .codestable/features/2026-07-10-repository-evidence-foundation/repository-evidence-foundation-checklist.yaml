dod:
  commands:
  - id: CMD-BUILD
    command: npm run build
    core: true
    failure_handling: fix-or-block
  - id: CMD-TYPECHECK
    command: npm run typecheck
    core: true
    failure_handling: fix-or-block
  - id: CMD-UNIT
    command: npm test -- --group runner-smoke --group contract --group di
    core: true
    failure_handling: fix-or-block
  - id: CMD-GOLDEN
    command: npm run test:golden -- --case runner-smoke --case manifest-schema --case evaluator-smoke
    core: true
    failure_handling: fix-or-block
  - id: CMD-MCP
    command: npm run test:mcp -- --case runner-smoke --case lifecycle-manifest-schema
    core: true
    failure_handling: fix-or-block
  evidence_required: [command_output, diff_summary, artifact_inventory, schema_samples]
  cleanliness:
    debug_output: forbidden
    temporary_todo_fixme: forbidden
    commented_out_code: forbidden
    unused_imports: forbidden
