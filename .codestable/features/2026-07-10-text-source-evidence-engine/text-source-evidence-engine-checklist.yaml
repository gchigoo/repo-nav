feature: 2026-07-10-text-source-evidence-engine
created: '2026-07-10'
steps:
- id: S1
  action: 实现 literal RipgrepBackend
  exit_signal: per-term case、fixed-string argv、JSON parser、no-result/unavailable/abort cases 全部可判定
  verification: npm test -- --group ripgrep-backend
  artifacts: [RipgrepBackend, versioned parser fixtures, adapter logs]
  status: pending
- id: S2
  action: 实现当前文件核验与 DiscoveryRecord merge
  exit_signal: 重复/permuted hits 只形成单一 record，discovery key/provenance 稳定且尚未产生 public class/ID
  verification: npm test -- --group evidence-merge
  artifacts: [DiscoveryRecord policy, permutation report]
  status: pending
- id: S3
  action: 实现封闭 direct-mapping classifier、layer resolver、public ID/order 与 exclusion accounting
  exit_signal: merged record 只分类一次，支持语法 confirmed，所有 path/decoy/unsupported form 不误确认且 ID/order/exclusion counts 稳定
  verification: npm test -- --group direct-mapping-classifier --group evidence-id-order && npm run test:golden -- --case source-field-mapping --case false-confirmation-decoys --case exclusion-summary
  artifacts: [classification truth table, layer resolver fixtures, Golden manifests, evaluator logs]
  status: pending
- id: S4
  action: 固化 ripgrep-only LocateResult baseline
  exit_signal: ok/no_result/backend_unavailable/partial/timeout 的 coverage 和 nextActions 逐字段符合设计状态表
  verification: npm run test:golden -- --case text-engine-baseline --case ripgrep-unavailable --case ripgrep-failed --case ripgrep-incomplete --case ripgrep-timeout
  artifacts: [status snapshots, fault fixture logs]
  status: pending
