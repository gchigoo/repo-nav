# F4 cross-platform blocking matrix.
# Action pins (reviewed 2026-07-31):
# - actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 (v7.0.0)
# - actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 (v7.0.0)
# - actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 (v7.0.0)
# - actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f (v6.0.0)
name: cross-platform-ci

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
      - repo-nav-public-beta
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-matrix:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cellId: linux-node22
            runner: ubuntu-24.04
            nodeMajor: 22
          - cellId: linux-node24
            runner: ubuntu-24.04
            nodeMajor: 24
          - cellId: windows-node22
            runner: windows-2025
            nodeMajor: 22
          - cellId: windows-node24
            runner: windows-2025
            nodeMajor: 24
          - cellId: macos-intel-node22
            runner: macos-15-intel
            nodeMajor: 22
          - cellId: macos-intel-node24
            runner: macos-15-intel
            nodeMajor: 24
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.nodeMajor }}
          package-manager-cache: false

      - id: install
        name: Install
        run: npm ci

      - name: Install pinned ripgrep
        shell: bash
        env:
          # @vscode/ripgrep postinstall hits GitHub API; unauthenticated runners get 403.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOOLS="${RUNNER_TEMP}/repo-nav-host-tools"
          mkdir -p "$TOOLS"
          npm install --prefix "$TOOLS" --no-save --no-package-lock --no-fund --no-audit \
            @vscode/ripgrep@1.15.9
          RG_BIN="$TOOLS/node_modules/@vscode/ripgrep/bin"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "$(cygpath -w "$RG_BIN")" >> "$GITHUB_PATH"
            "${RG_BIN}/rg.exe" --version
          else
            echo "$RG_BIN" >> "$GITHUB_PATH"
            "${RG_BIN}/rg" --version
          fi

      - id: runtime
        name: Runtime probe
        run: node --import tsx tools/ci/run-platform-contracts.mjs --runtime-probe --cell ${{ matrix.cellId }}

      - id: typecheck
        name: Typecheck
        run: npm run typecheck

      - id: unit
        name: Unit tests
        run: npm test

      - id: build
        name: Build
        run: npm run build

      - id: golden
        name: Golden tests
        run: npm run test:golden -- --all

      - id: mcp
        name: MCP tests
        run: npm run test:mcp:built -- --all

      - id: docs
        name: Docs smoke
        run: npm run test:docs:built

      - id: platform
        name: Platform contracts
        run: npm run test:platform

      - id: report
        name: Write core-command report
        if: always()
        shell: bash
        run: |
          node --import tsx tools/ci/write-platform-report.mjs \
            --cell "${{ matrix.cellId }}" \
            --output "test-artifacts/platform/core-command-${{ matrix.cellId }}.json" \
            --workflow-run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --source-sha "${{ github.sha }}" \
            --event-name "${{ github.event_name }}" \
            --summary "test-artifacts/platform/safe-summary.json" \
            --outcome "install=${{ steps.install.outcome }}" \
            --outcome "runtime=${{ steps.runtime.outcome }}" \
            --outcome "build=${{ steps.build.outcome }}" \
            --outcome "typecheck=${{ steps.typecheck.outcome }}" \
            --outcome "unit=${{ steps.unit.outcome }}" \
            --outcome "golden=${{ steps.golden.outcome }}" \
            --outcome "mcp=${{ steps.mcp.outcome }}" \
            --outcome "docs=${{ steps.docs.outcome }}" \
            --outcome "platform=${{ steps.platform.outcome }}"

      - name: Upload safe core-command report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cross-platform-baseline-${{ matrix.cellId }}-${{ github.run_attempt }}
          path: test-artifacts/platform/core-command-${{ matrix.cellId }}.json
          if-no-files-found: error
          retention-days: 14

      - id: assert-cell
        name: Assert cell report
        if: always()
        run: node --import tsx tools/ci/assert-platform-contract.mjs --cell-report test-artifacts/platform/core-command-${{ matrix.cellId }}.json

  macos-arm-unit:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Install pinned ripgrep
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOOLS="${RUNNER_TEMP}/repo-nav-arm-tools"
          mkdir -p "$TOOLS"
          npm install --prefix "$TOOLS" --no-save --no-package-lock --no-fund --no-audit \
            @vscode/ripgrep@1.15.9
          RG_BIN="$TOOLS/node_modules/@vscode/ripgrep/bin"
          echo "$RG_BIN" >> "$GITHUB_PATH"
          "${RG_BIN}/rg" --version

      - name: Clean
        run: npm run clean

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  codegraph-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Install pinned CodeGraph and ripgrep
        shell: bash
        env:
          # @vscode/ripgrep postinstall hits GitHub API; unauthenticated runners get 403.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOOLS="${RUNNER_TEMP}/repo-nav-codegraph-tools"
          mkdir -p "$TOOLS"
          npm install --prefix "$TOOLS" --no-save --no-package-lock --no-fund --no-audit \
            @colbymchenry/codegraph@1.5.0 @vscode/ripgrep@1.15.9
          RG_BIN="$TOOLS/node_modules/@vscode/ripgrep/bin"
          echo "$TOOLS/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$RG_BIN" >> "$GITHUB_PATH"

      - name: Prepare CodeGraph non-regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          codegraph init testkit/fixtures/codegraph-differential/typescript
          codegraph init testkit/fixtures/codegraph-differential/javascript
          codegraph init testkit/fixtures/codegraph-differential/python
          codegraph init testkit/fixtures/codegraph-differential/go

      - name: Run live CodeGraph integration
        run: npm run test:integration:codegraph

      - name: Enforce CodeGraph non-regression contract
        env:
          REPO_NAV_REQUIRE_CODEGRAPH_DIFFERENTIAL: '1'
        run: npm run benchmark:codegraph-differential

  cross-platform-required:
    name: cross-platform-required
    runs-on: ubuntu-24.04
    needs:
      - platform-matrix
      - macos-arm-unit
      - codegraph-integration
    if: always()
    steps:
      - name: Require matrix, macOS ARM unit, and CodeGraph integration success
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.platform-matrix.result }}" != "success" ]; then
            echo "platform-matrix result must be success; got ${{ needs.platform-matrix.result }}"
            exit 1
          fi
          if [ "${{ needs.macos-arm-unit.result }}" != "success" ]; then
            echo "macos-arm-unit result must be success; got ${{ needs.macos-arm-unit.result }}"
            exit 1
          fi
          if [ "${{ needs.codegraph-integration.result }}" != "success" ]; then
            echo "codegraph-integration result must be success; got ${{ needs.codegraph-integration.result }}"
            exit 1
          fi
