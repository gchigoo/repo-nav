# Tag-triggered release gate: verify SHA/version/tarball before publish.
# Publish remains an owner action; this workflow only blocks inconsistent tags.
name: release-tag-ci

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to validate (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tag ref
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported tag format: ${TAG}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Assert package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${PKG_VERSION}" != "${{ steps.tag.outputs.version }}" ]]; then
            echo "package.json version ${PKG_VERSION} != tag ${{ steps.tag.outputs.tag }}"
            exit 1
          fi
          echo "aligned sha=$(git rev-parse HEAD) version=${PKG_VERSION}"

      - name: Build
        run: npm run build

      - name: Pack release candidate tarball
        run: npm run package:smoke

      - name: Verify installed closure from packed tarball
        run: npm run package:closure:check

      - name: Fixture-scenario gate
        run: npm run benchmark:fixture-scenarios

      - name: CLI/MCP smoke from build
        shell: bash
        run: |
          set -euo pipefail
          node dist/cli/main.js --help
          test -f dist/main.js
