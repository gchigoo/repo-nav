  RedactionReasonCode:
    SECRET_LIKE_VALUE: {positive: contract-code-probes}
    CONNECTION_STRING: {positive: contract-code-probes}
    PERSONAL_DATA: {positive: contract-code-probes}
    BINARY_OR_OVERSIZED_CONTENT: {positive: contract-code-probes}
  NextActionCode:
    ADD_TERM: {positive: manifest-evaluator}
    ADD_SYMBOL_ANCHOR: {positive: contract-code-probes}
