schemaVersion: '1.0'
id: source-field-mapping
kind: success
fixtureRoot: testkit/fixtures/text-engine
request:
  repoPath: testkit/fixtures/text-engine
  question: Where is the source field mapped?
  terms: [targetField, row.source_field]
  termCase: insensitive
  layers: [server]
expected:
  ok: true
  status: ok
  confirmed:
    - file: server/mapping.fixture
      contains: targetField = row.source_field
      role: value-mapping
      reasonCodes: [EXACT_TERM_MATCH, DIRECT_ALIAS_MAPPING]
  candidates:
    - file: server/mapping.fixture
      contains: consume(row.source_field)
      role: reference
      reasonCodes: [EXACT_TERM_WITHOUT_DIRECT_MAPPING]
  forbiddenEvidenceIds:
    - evidence:v2:9999
  requiredCoverageCodes: []
  minimumExclusionCounts: {}
